name: Update Match Data

on:
  schedule:
    - cron: '*/30 * * * *'  # প্রতি ৩০ মিনিট পর পর রান হবে
  workflow_dispatch:        # ম্যানুয়ালি রান করার জন্য

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Python Script
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add matches.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update matches.json [skip ci]" && git push)
