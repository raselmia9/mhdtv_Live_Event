name: Scrape MHD TV Matches

on:
  scheduled:
    - cron: '*/30 * * * *' # প্রতি ৩০ মিনিট পর পর অটো আপডেট হবে (আপনার প্রয়োজনমতো সময় পরিবর্তন করতে পারেন)
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Python Script
        run: python main.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add matches.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update match data [skip ci]" && git push)
          
